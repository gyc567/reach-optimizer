name: daily-triage

# E1 — report-only L1 loop. Discovers work, rewrites STATE.md, appends to the
# run log. It never edits product code and never calls an LLM.
# Manual trigger: Actions → daily-triage → Run workflow.

on:
  schedule:
    - cron: '17 0 * * 1-5' # 00:17 UTC = 08:17 Beijing, weekdays
  workflow_dispatch:

permissions:
  contents: write # commit STATE.md + loop-run-log.md back
  pull-requests: read
  issues: read
  checks: read

concurrency:
  group: e1-daily-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Triage
        env:
          # `permissions:` scopes the token, but it still must be passed into
          # the step explicitly — without this the script sees no credential
          # (local runs fall back to `gh auth token`, Actions has none).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/triage.mjs

      - name: Publish state
        run: |
          git config user.name "loop-triage[bot]"
          git config user.email "loop-triage[bot]@users.noreply.github.com"
          git add STATE.md loop-run-log.md
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "chore(loop): E1 daily triage $(date -u +%FT%TZ)"
            git push
          fi

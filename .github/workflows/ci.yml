# CI / CD for topdiggx (formerly ReachOS web app).
#
# Philosophy:
#   This workflow runs ONLY the quality gate (typecheck + unit tests + lint).
#   Deployment is handled by the Vercel GitHub App, which is already installed
#   on this repository and auto-builds + deploys on every push to main.
#
# Triggers:
#   - push to main              → quality gate (status check on commit)
#   - pull_request to main      → quality gate (blocks merge if failing)
#   - workflow_dispatch         → manual rerun
#
# Notes:
#   - Actions are SHA-pinned (tags can be re-published; SHAs can't).
#   - Concurrency cancel-in-progress saves CI minutes on rapid pushes.
#   - paths-ignore skips CI for docs / config tweaks that don't affect runtime.
#   - ESLINT_USE_FLAT_CONFIG=false enables legacy .eslintrc mode, which is
#     what eslint-config-next ships with in this monorepo.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.omc/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.omc/**'
      - '.claude/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  ESLINT_USE_FLAT_CONFIG: 'false'
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a74872c4cb06a1787e105f44b3ad1515b568e8ab # v4.1.0
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c48000ad4d78ed4c75ebb918 # v4.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

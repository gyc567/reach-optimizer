name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build/test never connect to a database or external services; dummy
      # values satisfy lazy env getters (lib/env.ts) during `next build`.
      DATABASE_URL: postgresql://loop-ci:loop-ci@localhost:5432/loop-ci
      JWT_SECRET: loop-ci-dummy-secret
      X_CLIENT_ID: loop-ci-dummy
      X_CLIENT_SECRET: loop-ci-dummy
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # `typecheck` is `tsc --noEmit` and lib/db.ts imports PrismaClient from
        # the *generated* @prisma/client — a fresh checkout has none, and the
        # TS2305 import failure cascades into hundreds of implicit-any TS7006s.
        # `next build` generates it via the api build script, but typecheck runs
        # first, so generate explicitly. First main run 36953175802 failed here.
        run: pnpm --filter @reach/api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: ci-sweeper selftest
        run: node scripts/ci-sweeper.mjs --selftest
